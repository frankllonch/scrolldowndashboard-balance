[project]
name = "balance-takehome"
version = "1.0.0"
description = "From a device event log to metrics, a wellbeing index, alerts and reinforcements."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "plotly>=5.20",
]

[project.optional-dependencies]
# `balance/` needs neither: the CLI runs on pandas alone. Plotly is a build
# dependency of the page, and playwright drives the built page in a browser.
dev = ["pytest>=8", "playwright>=1.50"]

[project.scripts]
balance = "balance.run:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q --strict-markers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["balance"]
