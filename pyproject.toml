[project]
name = "balance-board"
version = "1.0.0"
description = "From a device event log to metrics, a wellbeing index, alerts and reinforcements."
requires-python = ">=3.12"
# Python computes; it draws nothing. There is no charting library here: the
# figures are built in the browser from the series `payload/` hands over.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
# playwright drives the built page in a real browser; ruff is the linter.
dev = ["pytest>=8", "playwright>=1.50", "ruff>=0.6"]

[project.scripts]
balance = "analysis.run:main"

[tool.ruff]
line-length = 88
extend-exclude = ["docs", "data"]

[tool.ruff.lint]
# Correctness and import hygiene. Formatting is not enforced: the code is
# hand-laid out and a formatter would fight the column lists in payload/.
select = ["F", "E9", "I"]

[tool.ruff.lint.per-file-ignores]
# The catalogue and the registries re-export on purpose.
"**/__init__.py" = ["F401"]
# Carried from the source repo with only their import paths changed, so their
# import order is left as it was rather than churned for style.
"tests/test_data_contract.py" = ["I001"]
"tests/test_events.py" = ["I001"]
"tests/test_intelligence.py" = ["I001"]
"tests/test_metrics.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q --strict-markers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analysis", "payload"]
